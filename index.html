<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EG Booking V2</title><link rel="stylesheet" href="style.css"></head><body><div id="login"><div class="card"><b>EG AUDIOVISUEL</b><h1>EG Booking</h1><form id="loginForm"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Mot de passe" required><button>Connexion</button></form><p id="err"></p></div></div><div id="app" class="hide"><header><h1>EG Booking</h1><span id="who"></span><button id="logout">Déconnexion</button></header><nav><button data-tab="planning">📅 Planning</button><button data-tab="messages">💬 Messages <i id="unread"></i></button><button data-tab="profile">👤 Ma fiche</button><button id="adminTab" data-tab="admin" class="hide">⚙️ Admin</button></nav><main><section id="planning"><div class="bar"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></div><div id="cal" class="calendar"></div><button id="planningCreate" class="planning-create hide">＋ Créer un booking</button><div id="bookings"></div></section><section id="messages" class="hide"><div class="messages"><aside><button id="newMsg">＋ Nouveau message</button><div id="people"></div></aside><article><h3 id="chatTitle">Sélectionne une conversation</h3><div id="chat"></div><form id="send"><input id="text" placeholder="Message…"><button>Envoyer</button></form></article></div></section><section id="profile" class="hide"><div class="card"><h2>Ma fiche</h2><form id="profileForm"><input id="pname" placeholder="Nom" required><input id="prole" placeholder="Fonction / établissement"><input id="pphone" placeholder="Téléphone"><input id="pemail" disabled><textarea id="paddress" placeholder="Adresse"></textarea><input id="pstyles" placeholder="Styles musicaux favoris"><button>Enregistrer</button></form></div></section><section id="admin" class="hide"><div class="card"><h2>Administration</h2><div id="users"></div><hr><h3>Demandes d'établissements</h3><div id="requests"></div><hr><button id="createBooking">＋ Créer un booking</button></div></section><div id="bookingModal" class="modal hide"><div class="modal-card"><div class="modal-head"><h2>Créer un booking</h2><button type="button" id="closeBooking">✕</button></div><form id="bookingForm"><label>Date<input id="bDate" type="date" required></label><label>Établissement<select id="bVenue" required></select></label><label>DJ<select id="bDj"><option value="">À définir</option></select></label><label>Horaires<input id="bTime" placeholder="23:00 - 04:00"></label><label>Type<input id="bType" value="Soirée DJ"></label><label>Statut<select id="bStatus"><option>Confirmé</option><option>En attente</option></select></label><label>Notes<textarea id="bNotes" placeholder="Informations complémentaires"></textarea></label><div class="modal-actions"><button type="button" id="cancelBooking">Annuler</button><button type="submit">Créer le booking</button></div><p id="bookingErr"></p></form></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
